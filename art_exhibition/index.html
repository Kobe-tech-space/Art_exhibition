<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>光在此处 · Light Stays Here — 云端画展</title>
    <meta name="description" content="光在此处：一场关于成都理工大学日常之美的云端画展。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="hero">

<!-- 自定义光标 · 地质锤(Rock Pick) -->
<div class="cursor" id="cursor" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <!-- 锤头:左方敲击面,右边逐渐收窄为镐尖 -->
        <path d="M6 17 L34 17 L56 24 L34 31 L6 31 Z" fill="currentColor" fill-opacity="0.12"/>
        <!-- 敲击面端线 -->
        <line x1="9"  y1="17" x2="9"  y2="31"/>
        <!-- 锤头 / 镐身 分界 -->
        <line x1="34" y1="17" x2="34" y2="31"/>
        <!-- 铆钉(柄孔) -->
        <circle cx="22" cy="24" r="1.6" fill="currentColor"/>
        <!-- 木柄 -->
        <path d="M18 31 L26 60 L32 60 L24 31 Z" fill="currentColor" fill-opacity="0.15"/>
        <!-- 防滑握纹 -->
        <line x1="22" y1="44" x2="30" y2="44"/>
        <line x1="23" y1="50" x2="30" y2="50"/>
        <line x1="24" y1="56" x2="31" y2="56"/>
    </svg>
</div>

<!-- 胶片噪点层 -->
<div class="grain" aria-hidden="true"></div>

<!-- 顶部阅读进度 -->
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- 顶部导航 -->
<header class="nav" id="nav">
    <div class="nav__brand" id="brandTitle">光与孤 <span>/</span> Light &amp; Solitude</div>
    <nav class="nav__links" id="navLinks" aria-label="展区导航"></nav>
</header>

<!-- 右侧章节 Indicator -->
<aside class="indicator" id="indicator" aria-hidden="true"></aside>

<!-- Hero · 序幕 -->
<section class="hero" id="hero">
    <div class="hero__backdrop" id="heroBackdrop" aria-hidden="true"></div>
    <div class="hero__scrim" aria-hidden="true"></div>
    <div class="hero__spotlight" id="heroSpot" aria-hidden="true"></div>
    <div class="hero__inner">
        <div class="hero__meta" id="heroMeta"></div>
        <h1 class="hero__title" id="heroTitle" aria-label="光在此处"></h1>
        <div class="hero__subtitle" id="heroSubtitle"></div>
        <div class="hero__divider"></div>
        <p class="hero__intro" id="heroIntro">这一组照片没有远方，只有走廊、窗台、白墙和你坐过的椅子。日常被认真看过一次，就不再普通。</p>
        <div class="hero__facts" id="heroFacts"></div>
        <button class="hero__cta" id="enterBtn" type="button">
            <span>推门而入</span>
            <svg width="28" height="10" viewBox="0 0 28 10" fill="none" aria-hidden="true">
                <path d="M0 5 H26 M22 1 L26 5 L22 9" stroke="currentColor" stroke-width="1"/>
            </svg>
        </button>
    </div>
    <div class="hero__scroll">SCROLL</div>
</section>

<!-- 幕布(点击"推门而入"时从中间裂开) -->
<div class="curtain" id="curtain" aria-hidden="true">
    <div class="curtain__half curtain__half--l"></div>
    <div class="curtain__half curtain__half--r"></div>
</div>

<!-- 策展人语 -->
<section class="curator reveal" id="curator">
    <div class="curator__label">CURATOR&rsquo;S NOTE</div>
    <blockquote class="curator__quote" id="curatorQuote"></blockquote>
    <div class="curator__sign">
        <div id="curatorAuthor"></div>
        <div id="curatorDate"></div>
    </div>
</section>

<!-- 终章 -->
<section class="epilogue reveal" id="epilogue">
    <div class="epilogue__line" id="epilogueLine"></div>
    <div class="epilogue__line-en" id="epilogueLineEn"></div>
    <div class="epilogue__line epilogue__line--secondary" id="epilogueLine2"></div>
    <div class="epilogue__line-en" id="epilogueLine2En"></div>
    <div class="epilogue__tools">
        <button type="button" id="backTop">回到序幕</button>
        <a href="#curator">重读策展人语</a>
    </div>
</section>

<!-- 灯箱(图片播放器) -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="作品查看器">
    <div class="viewer__counter" id="viewerCounter">01 / 12</div>
    <button class="viewer__btn viewer__close" id="viewerClose" aria-label="关闭">×</button>
    <button class="viewer__btn viewer__prev"  id="viewerPrev"  aria-label="上一张">‹</button>
    <button class="viewer__btn viewer__next"  id="viewerNext"  aria-label="下一张">›</button>
    <div class="viewer__stage">
        <img class="viewer__img" id="viewerImg" alt="">
    </div>
    <div class="viewer__plaque">
        <div class="viewer__no" id="viewerNo"></div>
        <h3 class="viewer__title" id="viewerTitle"></h3>
        <div class="viewer__meta" id="viewerMeta"></div>
        <p  class="viewer__desc"  id="viewerDesc"></p>
        <div class="viewer__index" id="viewerIndex"></div>
    </div>
    <div class="viewer__thumbs" id="viewerThumbs" aria-label="缩略图导航"></div>
</div>

<!-- 页脚 -->
<footer class="footer">
    <div>光在此处 <span>·</span> Curated Online <span>·</span> 2026</div>
    <div class="footer__fine">Typography: Cormorant Garamond &amp; Noto Serif SC · No works were harmed in the making of this exhibition.</div>
</footer>

<!-- 背景音乐 · 打开即循环 -->
<audio id="bgm" src="music/bgm.mp3" autoplay muted loop preload="auto" playsinline></audio>
<button id="bgmToggle" class="bgm-toggle bgm-toggle--pending" type="button" aria-label="播放/暂停背景音乐">
    <span class="bgm-toggle__icon" aria-hidden="true">
        <span class="bgm-toggle__wave"></span>
        <span class="bgm-toggle__wave"></span>
        <span class="bgm-toggle__wave"></span>
    </span>
</button>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
